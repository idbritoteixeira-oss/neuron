name: enxos
description: Aplicativo modular enxOS com autenticação por módulos e serviço Android em primeiro plano.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_foreground_task: ^11.0.3
  http: ^1.6.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "lib/core/assets/logo.png"
  min_sdk_android: 21
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true